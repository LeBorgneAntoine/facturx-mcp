<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Factur-X by Orvel">
  <!-- Factur-X mark: two ribbons weaving into one X. A Factur-X file is a PDF layer (ink) and an XML layer
       (accent) bound in a single document. Same grammar as the Orvel mark: stroke 6, round caps. -->
  <path d="M53 11 C14 11 50 53 11 53" fill="none" stroke="#4F6BFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M11 11 C50 11 14 53 53 53" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
</svg>
